name: Release

# 打版本号形式的标签（如 1.0.0）时自动：
#   1. 打包 core 的 release AAR
#   2. 附到对应的 GitHub Release 上
#   3. 触发 JitPack 构建，并等待构建结果
# JitPack 不支持推送产物，它是按需构建的；第 3 步只是提前把构建跑起来，
# 免得第一个使用者去承担几分钟的等待。
#
# 标签刻意不用 v 前缀：JitPack 的版本号就是标签名，带 v 之后 1.+ 这类动态版本
# 匹配不到（JitPack 的动态版本只认已构建过的 release）。所以统一用 1.0.0 形式。
on:
  push:
    tags:
      # 只匹配数字开头的标签
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要重新发布的已有标签（例如 1.0.0）'
        required: true

permissions:
  contents: write

env:
  JITPACK_GROUP: com.github.topdeepsk
  JITPACK_ARTIFACT: AndroidJavaShell

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 解析发布标签
        id: meta
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [ -z "$tag" ]; then
            echo "没有拿到标签名，无法发布" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "发布标签：$tag"

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 打包 core 与 service 的 release AAR
        run: |
          # 仓库里 gradlew 的权限位若被 Windows 提交弄丢（100644），Linux 上直接 ./gradlew 会 Permission denied
          chmod +x gradlew
          ./gradlew :core:assembleRelease :service:assembleRelease \
            "-Pversion=${{ steps.meta.outputs.tag }}" --no-daemon

      - name: 整理产物
        run: |
          mkdir -p dist
          cp core/build/outputs/aar/core-release.aar \
             "dist/${{ env.JITPACK_ARTIFACT }}-core-${{ steps.meta.outputs.tag }}.aar"
          cp service/build/outputs/aar/service-release.aar \
             "dist/${{ env.JITPACK_ARTIFACT }}-service-${{ steps.meta.outputs.tag }}.aar"
          ls -l dist

      - name: 上传 AAR 到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/${{ env.JITPACK_ARTIFACT }}-core-${{ steps.meta.outputs.tag }}.aar
            dist/${{ env.JITPACK_ARTIFACT }}-service-${{ steps.meta.outputs.tag }}.aar
          generate_release_notes: true

      - name: 更新 README 里的版本号
        run: |
          # 只替换安装示例里的坐标版本，JitPack 徽章本身是动态的，不需要动
          sed -i -E "s/(AndroidJavaShell:(core|service):)[0-9][0-9A-Za-z.+_-]*/\1${{ steps.meta.outputs.tag }}/g" \
            README.md README.zh-CN.md
          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "版本号已是最新，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          git commit -m "docs: bump README version to ${{ steps.meta.outputs.tag }}"
          # checkout 出来的是 tag（detached HEAD），先对齐 main 再推，避免 main 领先时推送失败
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: 触发 JitPack 构建并等待结果
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -uo pipefail
          pom="https://jitpack.io/${JITPACK_GROUP//.//}/${JITPACK_ARTIFACT}/${TAG}/${JITPACK_ARTIFACT}-${TAG}.pom"
          echo "请求 POM 以触发构建：$pom"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "$pom" || echo "000")
          echo "首次请求返回 HTTP $code（构建期间多为 404 或 200，JitPack 会异步开始构建）"

          api="https://jitpack.io/api/builds/${JITPACK_GROUP}/${JITPACK_ARTIFACT}/${TAG}"
          # JitPack 返回的是格式化过的 JSON（"status" : "ok"），冒号两侧有空格，正则必须容错，
          # 否则永远匹配不上，会白等满 10 分钟
          for i in $(seq 1 40); do
            body=$(curl -sS --max-time 30 "$api" || true)
            if printf '%s' "$body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
              echo "JitPack 构建成功：$body"
              exit 0
            fi
            if printf '%s' "$body" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"error"'; then
              echo "JitPack 构建失败：$body" >&2
              exit 1
            fi
            echo "[$i/40] 构建中…（$api）"
            sleep 15
          done
          echo "等待超时：JitPack 可能仍在构建，请到 https://jitpack.io/#${JITPACK_GROUP}/${JITPACK_ARTIFACT}/${TAG} 查看"
